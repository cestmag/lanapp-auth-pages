<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>確認が完了しました。アプリに戻ってログインをしてください。</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: radial-gradient(circle at 10% 0%, #dbeafe 0%, #f8fafc 45%, #e0e7ff 100%);
      --text: #0f172a;
      --surface: rgba(255, 255, 255, 0.78);
      --border: rgba(148, 163, 184, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      background: var(--bg);
      font-family: Inter, "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      font-size: 1.0625rem;
    }
    h1, p {
      margin: 0;
      width: min(760px, 100%);
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    }
    main {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }
    footer {
      color: #475569;
      font-size: 0.875rem;
      text-align: center;
    }
    h1 { font-size: clamp(1.6rem, 2.6vw, 2.2rem); letter-spacing: -0.02em; }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1, p { padding: 1rem; border-radius: 12px; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>確認が完了しました。アプリに戻ってログインをしてください。</h1>
    <p lang="en">Confirmation is complete. Please return to the app and log in.</p>
  </main>
  <footer>© 2026 Lanpraque. All Rights Reserved.</footer>
</body>
</html>
