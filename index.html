<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lanapp-auth-pages</title>
<style>
  :root {
    color-scheme: light;
    --bg: radial-gradient(circle at 20% 0%, #e0e7ff 0%, #f8fafc 45%, #eef2ff 100%);
    --text: #0f172a;
    --card: rgba(255, 255, 255, 0.72);
    --border: rgba(148, 163, 184, 0.35);
    --accent: #4f46e5;
    --accent-soft: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 3rem 1.25rem;
    font-family: Inter, "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    place-items: center;
    font-size: 1.0625rem;
  }
  h1, nav {
    width: min(760px, 100%);
  }
  h1 {
    margin: 0 0 1rem;
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    letter-spacing: -0.02em;
  }
  nav {
    margin: 0;
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(10px);
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
  }
  ul {
    display: grid;
    gap: 0.75rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  a {
    display: block;
    padding: 0.8rem 1rem;
    border-radius: 12px;
    color: #fff;
    background: var(--accent);
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  a:hover, a:focus-visible {
    background: var(--accent-soft);
    box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28);
    transform: translateY(-1px);
  }
  @media (max-width: 600px) {
    body {
      padding: 1.5rem 1rem;
      place-items: start stretch;
    }
    h1 { font-size: 1.75rem; }
    nav {
      padding: 1rem 1.1rem;
    }
    a { min-height: 44px; }
  }
</style>
</head>
<body>
  <h1>lanapp-auth-pages!</h1>
  <nav aria-label="関連ページ">
    <ul>
      <li><a href="./confirmed/">認証完了ページ</a></li>
      <li><a href="./auth-callback/">認証コールバック</a></li>
      <li><a href="./.well-known/assetlinks.json">Android アプリリンク設定</a></li>
      <li><a href="./delete-account/">アカウントデータ削除の仕方</a></li>
      <li><a href="./delete-data/">データ削除について</a></li>
      <li><a href="./privacy-policy/">プライバシーポリシー</a></li>
    </ul>
  </nav>
</body>
</html>
