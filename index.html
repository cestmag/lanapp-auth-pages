<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lanpraqueは、単語・動詞活用・会話を楽しく学べる3つの外国語学習アプリを提供しています。">
<title>Lanpraque</title>
<style>
  :root {
    color-scheme: light;
    --bg: radial-gradient(circle at 20% 0%, #e0e7ff 0%, #f8fafc 45%, #eef2ff 100%);
    --text: #0f172a;
    --muted: #475569;
    --accent: #4f46e5;
    --accent-soft: #6366f1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 4rem 1.25rem;
    font-family: Inter, "Noto Sans JP", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 1.0625rem;
  }
  main {
    width: min(880px, 100%);
    margin: 0 auto;
  }
  header {
    margin-bottom: 2.25rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    color: var(--accent);
    font-size: clamp(2.5rem, 7vw, 4.75rem);
    letter-spacing: -0.04em;
  }
  h3 {
    margin: 0.75rem 0 0;
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    letter-spacing: 0.04em;
  }
  .introduction {
    margin: 0 auto 1.5rem;
    color: var(--muted);
    line-height: 1.9;
    text-align: center;
  }
  .apps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .app {
    min-height: 155px;
    padding: 1.5rem;
    border: 1px solid transparent;
    border-radius: 20px;
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
  }
  .app:nth-child(1) {
    background: #4d7c0f;
  }
  .app:nth-child(2) {
    background: #7c3aed;
  }
  .app:nth-child(3) {
    background: #c2410c;
  }
  .app h2 {
    margin: 0 0 0.65rem;
    color: #ffffff;
    font-size: 1.25rem;
  }
  .app p {
    margin: 0;
    color: rgba(255, 255, 255, 0.92);
    line-height: 1.7;
  }
  nav {
    margin-top: 2rem;
    text-align: center;
  }
  nav ul {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem 1.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  nav a {
    color: var(--muted);
    font-size: 0.9rem;
    text-underline-offset: 0.2em;
    transition: color 0.2s ease;
  }
  nav a:hover,
  nav a:focus-visible { color: var(--accent-soft); }
  @media (max-width: 700px) {
    body { padding: 2.5rem 1rem; }
    header { margin-bottom: 1.75rem; }
    .apps { grid-template-columns: 1fr; }
    .app { min-height: auto; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <h1>Lanpraque</h1>
      <h3>新しい言語。新しい世界。</h3>
    </header>

    <p class="introduction">私たちは、外国語学習を楽しく続けるための3つのアプリを提供しています。</p>
    <ul class="apps">
      <li class="app">
        <h2>Wordmemorizz</h2>
        <p>覚えたい言葉を効率よく身につける単語帳。</p>
      </li>
      <li class="app">
        <h2>Conjupong</h2>
        <p>遊びながら動詞の活用を学べる学習ゲーム。</p>
      </li>
      <li class="app">
        <h2>Speacarrot</h2>
        <p>初めての会話練習</p>
      </li>
    </ul>

    <nav aria-label="関連ページ">
      <ul>
        <li><a href="./confirmed/">認証完了ページ</a></li>
        <li><a href="./auth-callback/">認証コールバック</a></li>
        <li><a href="./.well-known/assetlinks.json">Android アプリリンク設定</a></li>
        <li><a href="./delete-account/">アカウントデータ削除の仕方</a></li>
        <li><a href="./delete-data/">データ削除について</a></li>
        <li><a href="./privacy-policy/">プライバシーポリシー</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
