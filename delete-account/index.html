<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>アカウントデータ削除の仕方 - LanApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 0%, #fee2e2 0%, #fff7ed 35%, #eff6ff 100%);
      --text: #0f172a;
      --surface: rgba(255, 255, 255, 0.84);
      --border: rgba(148, 163, 184, 0.45);
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem;
      max-width: 820px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      font-size: 1.0625rem;
    }
    main {
      margin: 0 0 1rem;
      padding: 1rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { color: var(--danger); letter-spacing: -0.01em; }
    ol { margin: 1.5rem 0 0; padding-left: 1.75rem; }
    li { margin-top: 0.75rem; padding-left: 0.25rem; }
    li::marker { color: var(--danger); font-weight: 700; }
    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem; }
      main { padding: 1rem; border-radius: 12px; }
      h1 { font-size: 1.75rem; line-height: 1.25; }
    }
  </style>
</head>
<body>
  <main>
    <h1>アカウントデータ削除の仕方</h1>
    <p>アカウントとユーザーデータは、各アプリから次の手順で削除できます。</p>
    <ol>
      <li>アプリのプロフィールページを開きます。</li>
      <li>ページ右上の「アカウント削除」をクリックします。</li>
      <li>画面の指示に従って、アカウントとユーザーデータを削除します。</li>
    </ol>
  </main>
</body>
</html>
